# nginx site for the cruise map. install.sh copies this to
# /etc/nginx/sites-available/cruise with __DOMAIN__ filled in.
# certbot later adds the HTTPS (port 443) parts to the installed copy.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name __DOMAIN__;

    root /srv/cruise;
    index index.html;

    # Compress text formats; the 5 MB EEZ file goes over the wire as ~2.5 MB.
    gzip on;
    gzip_min_length 1024;
    gzip_types application/json application/geo+json application/javascript text/css image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=300";
    }

    location ~ \.geojson$ {
        default_type application/geo+json;
        add_header Cache-Control "public, max-age=300";
    }

    # Tiles for a given date never change once written.
    location /tiles/ {
        add_header Cache-Control "public, max-age=86400";
    }

    # Rewritten by every run of the daily job.
    location = /layer_config.json {
        add_header Cache-Control "no-cache";
    }
    location /colorbars/ {
        add_header Cache-Control "no-cache";
    }
}
